spring:
  application:
    name: profile-copilot

  datasource:
    url: jdbc:h2:mem:profiledb;DB_CLOSE_DELAY=-1    # never auto-destroy on last-connection-close.keep it alive for the lifetime of the JVM, and only tear it down when the application actually shuts down.
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2
        options:
          temperature: 0.1

server:
  port: 8080

logging:
  level:
    com.copilot.profile: DEBUG
